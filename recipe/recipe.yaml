context:
  version: "1.24.0"
  node_min: "22"
  node_check_max: "26"
  basic_test:
    yaml-language-server 2>&1 | grep -q 'Connection input stream is not set.'

package:
  name: yaml-language-server
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/yaml-language-server/-/yaml-language-server-${{ version }}.tgz
  sha256: 11a321032012131f2ccdf7952dc347ce05291c66931a5de2f449b2dfc81f24b2

build:
  number: 0
  noarch: generic

requirements:
  host:
    - nodejs ${{ node_min }}.*
    - pnpm
    - pnpm-licenses
  run:
    - nodejs >=${{ node_min }}

tests:
  - requirements:
      run:
        - nodejs ${{ node_min }}.*
    script:
      - ${{ basic_test }}
  - requirements:
      run:
        - nodejs ${{ node_check_max }}.*
    script:
      - ${{ basic_test }}

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: Language Server for Yaml Files
  homepage: https://github.com/redhat-developer/yaml-language-server
  repository: https://github.com/redhat-developer/yaml-language-server

extra:
  recipe-maintainers:
    - danielnachun
